
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { padding: 12px 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.controls label { font-size: 12px; color: var(--text-secondary); }
.filter-btn { font-size: 11px; padding: 4px 10px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface-2); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-btn:hover { background: var(--surface-1); }
.filter-btn.active { background: var(--fill-accent); color: var(--on-accent); border-color: var(--fill-accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
.legend-dot { width: 12px; height: 12px; border-radius: 2px; }
#map-container { position: relative; width: 100%; overflow-x: auto; }
svg text { font-family: var(--font-sans); }
.plot-rect { cursor: pointer; transition: opacity .15s; }
.plot-rect:hover { opacity: 0.7; }
#tooltip { position: fixed; background: var(--surface-2); border: 0.5px solid var(--border-strong); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--text-primary); pointer-events: none; display: none; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,.12); max-width: 200px; }
#tooltip strong { font-size: 13px; display: block; margin-bottom: 3px; }
#tooltip span { color: var(--text-secondary); display: block; line-height: 1.5; }
.info-bar { margin-top: 10px; padding: 8px 12px; background: var(--surface-1); border-radius: var(--radius); font-size: 12px; color: var(--text-secondary); border: 0.5px solid var(--border); }
.info-bar strong { color: var(--text-primary); }
</style>

<div id="app">
  <div class="controls">
    <label>Filter:</label>
    <button class="filter-btn active" onclick="setFilter('all')">All</button>
    <button class="filter-btn" onclick="setFilter('A')">Block A</button>
    <button class="filter-btn" onclick="setFilter('B')">Block B</button>
    <button class="filter-btn" onclick="setFilter('B2')">Block B2</button>
    <button class="filter-btn" onclick="setFilter('D')">Block D</button>
    <button class="filter-btn" onclick="setFilter('amenity')">Amenities</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div>Block A (80 yd)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fb923c"></div>Block B (80 yd)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#facc15"></div>Block B2 (80 yd)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e879f9"></div>Block D (150 yd)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Parks</div>
    <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>Amenities</div>
  </div>
  <div id="map-container">
    <svg id="map" width="100%" viewBox="0 0 900 500" style="display:block;min-width:600px;"></svg>
  </div>
  <div class="info-bar" id="info-bar">
    Hover over a plot to see details. Labour City — Total residential &amp; commercial plots across 4 blocks + amenity zones.
  </div>
</div>
<div id="tooltip"></div>

<script>
const SVG_NS = 'http://www.w3.org/2000/svg';

// ── Road layout ──────────────────────────────────────────────────────────────
// Main boundary: trapezoidal shape (wider at top, narrower at bottom-right)
// 50' wide road at bottom, 30' wide roads everywhere else

// ── Data ─────────────────────────────────────────────────────────────────────
// Block A: plots 1–68 (red), two sub-columns
// Block B: plots 1–95 (orange), densely packed
// Block B2 (yellow): plots in central zone
// Block D (pink/magenta): plots 1–72 right side + bottom strip 1–34

// We'll build a schematic representation with approximate spatial layout
const blocks = [
  // Block A — left side, 30' road bordered
  { id:'A', label:'Block A', color:'#fca5a5', stroke:'#dc2626', plots: range(1,68), type:'residential', size:'80 sq.yd', x:30, y:60, cols:4, rows:17, pw:28, ph:16 },
  // Block B — center-left  
  { id:'B', label:'Block B', color:'#fed7aa', stroke:'#ea580c', plots: range(1,95), type:'residential', size:'80 sq.yd', x:165, y:60, cols:5, rows:19, pw:28, ph:14 },
  // Block B2 — center (yellow in plan)
  { id:'B2', label:'Block B2', color:'#fef08a', stroke:'#ca8a04', plots: range(1,120), type:'residential', size:'80 sq.yd', x:340, y:60, cols:5, rows:24, pw:28, ph:12 },
  // Block D — right side (magenta)
  { id:'D', label:'Block D', color:'#f0abfc', stroke:'#a21caf', plots: range(1,72), type:'residential', size:'150 sq.yd', x:620, y:60, cols:4, rows:18, pw:30, ph:16 },
];

const amenities = [
  { id:'mosque', label:'Mosque', color:'#93c5fd', stroke:'#1d4ed8', x:530, y:80, w:80, h:90, icon:'🕌' },
  { id:'school', label:'School', color:'#6ee7b7', stroke:'#065f46', x:695, y:310, w:75, h:80, icon:'🏫' },
  { id:'community', label:'Community\nCentre', color:'#6ee7b7', stroke:'#065f46', x:612, y:310, w:75, h:80, icon:'🏢' },
  { id:'parkA', label:'Park A', color:'#86efac', stroke:'#15803d', x:30, y:380, w:130, h:55, icon:'🌿' },
  { id:'parkB', label:"Park 'B'", color:'#86efac', stroke:'#15803d', x:245, y:385, w:130, h:42, icon:'🌿' },
  { id:'parkD1', label:'Park D1', color:'#86efac', stroke:'#15803d', x:620, y:420, w:130, h:42, icon:'🌿' },
  { id:'parkD2', label:'Park D2', color:'#86efac', stroke:'#15803d', x:755, y:60, w:120, h:90, icon:'🌿' },
];

const roads = [
  { label:"50'-0\" Wide Road", x:30, y:450, w:860, h:24, color:'#d1d5db' },
  { label:"30' Wide Road (top)", x:30, y:36, w:860, h:20, color:'#e5e7eb' },
  { label:"30' Wide Road (center)", x:340, y:240, w:180, h:20, color:'#e5e7eb' },
];

function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }

const svg = document.getElementById('map');
let currentFilter = 'all';

function makeel(tag, attrs){
  const el = document.createElementNS(SVG_NS, tag);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}

function makeText(txt, x, y, opts={}){
  const el = makeel('text', { x, y, 'text-anchor': opts.anchor||'middle', 'font-size': opts.size||10, fill: opts.fill||'#1f2937', 'font-weight': opts.bold?'500':'400', 'dominant-baseline':'central' });
  el.textContent = txt;
  return el;
}

function drawRoads(){
  const g = makeel('g', {});
  // Outer boundary
  const boundary = makeel('polygon', { points:'20,30 880,30 860,480 20,480', fill:'none', stroke:'#374151', 'stroke-width':'2' });
  g.appendChild(boundary);

  // 50' road at bottom
  const r50 = makeel('rect', { x:20, y:440, width:840, height:28, fill:'#d1d5db', rx:2 });
  g.appendChild(r50);
  g.appendChild(makeText("50'-0\" Wide Road", 440, 454, {size:9, fill:'#374151', bold:true}));

  // Top 30' road
  const rtop = makeel('rect', { x:20, y:30, width:840, height:22, fill:'#e5e7eb', rx:2 });
  g.appendChild(rtop);
  g.appendChild(makeText("30' Wide Road", 440, 41, {size:8, fill:'#4b5563'}));

  // Internal 30' roads (vertical separators)
  [[155,30,415], [315,30,415], [510,30,440], [610,30,440]].forEach(([x,y,h])=>{
    const road = makeel('rect', { x, y, width:12, height:h-y, fill:'#e5e7eb' });
    g.appendChild(road);
  });

  // Horizontal internal road (center)
  const rmid = makeel('rect', { x:315, y:235, width:195, height:12, fill:'#e5e7eb' });
  g.appendChild(rmid);
  g.appendChild(makeText("30' Wide Road", 412, 241, {size:7.5, fill:'#6b7280'}));

  // Bottom 30' road (parallel to 50')
  const r30b = makeel('rect', { x:155, y:410, width:500, height:16, fill:'#e5e7eb' });
  g.appendChild(r30b);
  g.appendChild(makeText("30' Wide Road", 405, 418, {size:7.5, fill:'#6b7280'}));

  svg.appendChild(g);
}

function drawBlock(b){
  const g = makeel('g', { 'data-block': b.id });
  const totalPlots = b.plots.length;
  const cols = b.cols;
  const rows = Math.ceil(totalPlots / cols);
  const pw = b.pw, ph = b.ph, gap = 1;
  const blockW = cols*(pw+gap)+6;
  const blockH = rows*(ph+gap)+20;

  // Block background
  const bg = makeel('rect', { x:b.x-4, y:b.y-18, width:blockW, height:blockH, fill:b.color, stroke:b.stroke, 'stroke-width':'1', rx:3, opacity:'0.3' });
  g.appendChild(bg);

  // Block label
  const lbl = makeText(`Block ${b.id}`, b.x + blockW/2 - 4, b.y - 8, {size:9, fill:b.stroke, bold:true});
  g.appendChild(lbl);

  b.plots.forEach((plotNo, i)=>{
    const col = i % cols;
    const row = Math.floor(i / cols);
    const px = b.x + col*(pw+gap);
    const py = b.y + row*(ph+gap);

    const rect = makeel('rect', { x:px, y:py, width:pw, height:ph, fill:b.color, stroke:b.stroke, 'stroke-width':'0.5', rx:1, class:'plot-rect' });
    rect.dataset.block = b.id;
    rect.dataset.plot = plotNo;
    rect.dataset.size = b.size;
    rect.dataset.type = b.type;

    rect.addEventListener('mouseenter', e => showTooltip(e, `Block ${b.id} — Plot ${plotNo}`, [`Size: ${b.size}`, `Type: ${b.type}`, `Block: ${b.id}`]));
    rect.addEventListener('mousemove', moveTooltip);
    rect.addEventListener('mouseleave', hideTooltip);
    rect.addEventListener('click', () => {
      document.getElementById('info-bar').innerHTML = `<strong>Block ${b.id} — Plot #${plotNo}</strong> &nbsp; Size: ${b.size} &nbsp;|&nbsp; Type: Residential plot &nbsp;|&nbsp; Block: ${b.id}`;
    });
    g.appendChild(rect);

    // Plot number (only if big enough)
    if(pw >= 20 && ph >= 10){
      const t = makeText(plotNo, px+pw/2, py+ph/2, {size:6, fill:b.stroke});
      g.appendChild(t);
    }
  });

  svg.appendChild(g);
}

function drawAmenities(){
  amenities.forEach(a => {
    const g = makeel('g', {});
    const rect = makeel('rect', { x:a.x, y:a.y, width:a.w, height:a.h, fill:a.color, stroke:a.stroke, 'stroke-width':'1', rx:4 });
    g.appendChild(rect);

    const lines = a.label.split('\n');
    lines.forEach((line, i)=>{
      const t = makeText(line, a.x+a.w/2, a.y+a.h/2 + (i - (lines.length-1)/2)*11, {size:8.5, fill:'#065f46', bold:true});
      g.appendChild(t);
    });

    g.style.cursor = 'pointer';
    g.addEventListener('mouseenter', e => showTooltip(e, a.label.replace('\n',' '), ['Type: Amenity zone', `Location: ${a.label}`]));
    g.addEventListener('mousemove', moveTooltip);
    g.addEventListener('mouseleave', hideTooltip);
    svg.appendChild(g);
  });
}

function drawTitle(){
  const g = makeel('g', {});
  // Right side vertical title
  const t = makeel('text', { x:895, y:250, 'text-anchor':'middle', 'font-size':16, fill:'#1f2937', 'font-weight':'500', transform:'rotate(90,895,250)' });
  t.textContent = 'LABOUR CITY';
  g.appendChild(t);
  svg.appendChild(g);
}

function showTooltip(e, title, lines){
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `<strong>${title}</strong>${lines.map(l=>`<span>${l}</span>`).join('')}`;
  tt.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e){
  const tt = document.getElementById('tooltip');
  tt.style.left = (e.clientX+12)+'px';
  tt.style.top = (e.clientY-10)+'px';
}
function hideTooltip(){
  document.getElementById('tooltip').style.display='none';
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.includes(f==='all'?'All':f));
    if(f==='all') document.querySelector('.filter-btn').classList.add('active');
  });
  document.querySelectorAll('[data-block]').forEach(g=>{
    const bid = g.getAttribute('data-block');
    if(f==='all' || f===bid) { g.style.opacity='1'; g.style.pointerEvents=''; }
    else { g.style.opacity='0.12'; g.style.pointerEvents='none'; }
  });
  if(f==='amenity'){
    document.querySelectorAll('[data-block]').forEach(g=>{ g.style.opacity='0.12'; g.style.pointerEvents='none'; });
  }
}

// Draw everything
drawRoads();
blocks.forEach(drawBlock);
drawAmenities();
drawTitle();
</script>
